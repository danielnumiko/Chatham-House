<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker cards: client preview (CHAT-2088)</title>
  <style>
    @font-face { font-family: "Calibre"; src: url("fonts/Calibre-Medium.otf") format("opentype"); font-weight: 500; font-display: swap; }

    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      font-family: "Calibre", "Helvetica Neue", Helvetica, sans-serif;
    }

    /* Device viewports */
    .viewport {
      display: block;
      border: 0;
      background: #f5f5f5;
      margin: 0 auto;
    }
    .viewport[data-device="desktop"] { width: 1280px; height: 832px; }
    .viewport[data-device="mobile"] { width: 393px; height: 852px; border-radius: 24px; outline: 1px solid #d9d9d9; }

    /* Floating Desktop / Mobile switch */
    .switch {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #1e1e1e;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }
    .switch button {
      min-height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: none;
      color: #ffffff;
      font: 500 15px/1 "Calibre", "Helvetica Neue", Helvetica, sans-serif;
      cursor: pointer;
    }
    .switch button:hover { background: #3a3a3a; }
    .switch button[aria-pressed="true"] { background: #ffffff; color: #1e1e1e; }
    .switch button:focus-visible { outline: 2px solid #0069b5; outline-offset: 2px; }
  </style>
</head>
<body>
  <iframe class="viewport" id="viewport" data-device="desktop" src="index.html" title="Speaker cards preview"></iframe>

  <div class="switch" role="group" aria-label="Preview size">
    <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-device="mobile" aria-pressed="false">Mobile</button>
  </div>

  <script>
    (function () {
      var frame = document.getElementById("viewport");
      var buttons = document.querySelectorAll(".switch button");

      function show(device) {
        frame.setAttribute("data-device", device);
        Array.prototype.forEach.call(buttons, function (b) {
          b.setAttribute("aria-pressed", b.getAttribute("data-device") === device ? "true" : "false");
        });
        history.replaceState(null, "", "#" + device);
      }

      Array.prototype.forEach.call(buttons, function (b) {
        b.addEventListener("click", function () { show(b.getAttribute("data-device")); });
      });

      show(location.hash === "#mobile" ? "mobile" : "desktop");
    })();
  </script>
</body>
</html>
